<!DOCTYPE html>
<meta charset="utf-8">
<style>

body {
  text-align: center;
}

svg {
  margin-top: 32px;
  border: 1px solid #aaa;
}

.dog rect {
  fill: #fff;
  stroke: steelblue;
  stroke-width: 1px;
}

.dog {
  font: 14px sans-serif;
  cursor: pointer;
}

.link {
  fill: none;
  stroke: #ccc;
  stroke-width: 1.5px;
}

</style>
<body>
<script src="//cdnjs.cloudflare.com/ajax/libs/d3/3.5.5/d3.min.js"></script>
<script>

var data;
  var dx = 600;
  var dy = width / 6;
  var margin = { top: 70, right: 40, bottom: 50, left: 90 };
var memberBox = {
    width: 375,
    height: 45,
    marginHeight: 180,
    marginWidth: 100
  };
    var direction = 1;
  var radius = (dx * 1.0) / 10;
//var boxWidth = 150,
  //  boxHeight = 40;

// Setup zoom and pan
var zoom = d3.behavior.zoom()
  .scaleExtent([.1,2])
  .on('zoom', function(){
    svg.attr("transform", "translate(" + d3.event.translate + ") scale(" + d3.event.scale + ")");
  })
  // Offset so that first pan and zoom does not jump back to the origin
  .translate([150, 200]);

var svg = d3.select("body").append("svg")
  .attr('width', 1000)
  .attr('height', 500)
  .call(zoom)
  .append('g')
  
  // Left padding of tree so that the whole root node is on the screen.
  // TODO: find a better way
  .attr("transform", "translate(150,200)");

var tree = d3.layout.tree()
  
  // Using nodeSize we are able to control
  // the separation between nodes. If we used
  // the size parameter instead then d3 would
  // calculate the separation dynamically to fill
  // the available space.
    .nodeSize([
      memberBox.height + memberBox.marginHeight + radius * 2,
      memberBox.width + memberBox.marginWidth + radius * 2
    ])
  // By default, cousins are drawn further apart than siblings.
  // By returning the same value in all cases, we draw cousins
  // the same distance apart as siblings.
  .separation(function(){
    return .5;
  })
  
  // Tell d3 what the child nodes are. Remember, we're drawing
  // a tree so the ancestors are child nodes.
  .children(function(dog){
    
    // If the dog is collapsed then tell d3
    // that they don't have any ancestors.
    if(dog.collapsed){
      return;
    } else {
      return dog.children;
    }
  });

d3.json('data/Mahalo_ped.json', function(error, json){
  
  if(error) {
    return console.error(error);
  }
  
  // Start with only the first few generations showing
  json.children.forEach(function(gen2){
    gen2.children.forEach(function(gen3){
      collapse(gen3);
    });
  });
  
  data = json;
  
  draw();
      
});

function draw(){
  
  var nodes = tree.nodes(data),
      links = tree.links(nodes);

  // Update nodes    
  var node = svg.selectAll("g.dog")
      
      // The function we are passing provides d3 with an id
      // so that it can track when data is being added and removed.
      // This is not necessary if the tree will only be drawn once
      // as in the basic example.
      .data(nodes, function(dog){ return dog.index; });
      
  // Add any new nodes
  var nodeEnter = node.enter().append("g")
      .attr("class", "dog")
      .on('click', toggleDog);

  // Draw the rectangle dog boxes
  nodeEnter.append("rect")
      .attr({
        x: -(boxWidth/2),
        y: -(boxHeight/2),
        width: boxWidth,
        height: boxHeight
      });

  // Draw the dog's name and position it inside the box
  nodeEnter.append("text")
      .attr("dx", -(boxWidth/2) + 10)
      .attr("dy", 0)
      .attr("text-anchor", "start")
      .attr('class', 'name')
      .text(function(d) { 
        return d.regName; 
      });
  
  // Update the position of both old and new nodes
  node.attr("transform", function(d) { return "translate(" + d.y + "," + d.x + ")"; });
  
  // Remove nodes we aren't showing anymore
  node.exit().remove();

  // Update links
  var link = svg.selectAll("path.link")
  
      // The function we are passing provides d3 with an id
      // so that it can track when data is being added and removed.
      // This is not necessary if the tree will only be drawn once
      // as in the basic example.
      .data(links, function(d){ return d.target.index; });
  
  // Add new links    
  link.enter().append("path")
      .attr("class", "link");
  
  // Remove any links we don't need anymore
  // if part of the tree was collapsed
  link.exit().remove();
  
  // Update the links positions (old and new)
  link.attr("d", elbow);
}

/**
 * Update a dog's state when they are clicked.
 */
function toggleDog(dog){
  if(dog.collapsed){
    dog.collapsed = false;
  } else {
    collapse(dog);
  }
  draw();
}

/**
 * Collapse dog (hide their ancestors). We recursively
 * collapse the ancestors so that when the dog is
 * expanded it will only reveal one generation. If we don't
 * recursively collapse the ancestors then when
 * the dog is clicked on again to expand, all ancestors
 * that were previously showing will be shown again.
 * If you want that behavior then just remove the recursion
 * by removing the if block.
 */
function collapse(dog){
  dog.collapsed = true;
  if(dog.children){
    dog.children.forEach(collapse);
  }
}
    
/**
 * Custom path function that creates straight connecting lines.
 * Calculate start and end position of links.
 * Instead of drawing to the center of the node,
 * draw to the border of the dog profile box.
 * That way drawing order doesn't matter. In other
 * words, if we draw to the center of the node
 * then we have to draw the links first and the
 * draw the boxes on top of them.
 */
function elbow(d) {
  var sourceX = d.source.x,
      sourceY = d.source.y + (boxWidth / 2),
      targetX = d.target.x,
      targetY = d.target.y - (boxWidth / 2);
      
  return "M" + sourceY + "," + sourceX
    + "H" + (sourceY + (targetY-sourceY)/2)
    + "V" + targetX 
    + "H" + targetY;
}

</script>
